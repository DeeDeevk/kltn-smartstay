version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vikahotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vikahotel
    ports:
      - "5432:5432"
    volumes:
      - vikahotel_pg_data:/var/lib/postgresql/data

volumes:
  vikahotel_pg_data:
