version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vikahotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sapassword
      POSTGRES_DB: vikahotel
    ports:
      - "5432:5432"
    volumes:
      - vikahotel_pg_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: vikahotel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vikahotel_redis_data:/data

volumes:
  vikahotel_pg_data:
  vikahotel_redis_data:
